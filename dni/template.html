<!-- UCF CALENDAR WIDGET -->
<script>
    $(function(){
        var $events = $(".events");
        var $noEventsMsg = $(".no-events-message");

        // $.getUCFEvents is exposed by the UCF events widget script (tools/script.js).
        // Use it to check whether the calendar actually has any upcoming events
        // before rendering the widget, so we can show a friendly message instead
        // of an empty box when there's nothing to display.
        $.getUCFEvents({
            calendar_id: $events.data("calendar-id"),
            limit: $events.data("limit")
        }, function(events){
            if (events && events.length > 0) {
                $events.eventsUCF();
            } else {
                $events.hide();
                $noEventsMsg.show();
            }
        });
    });
</script>
